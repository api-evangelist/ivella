description: >-
  Ivella was a consumer fintech company that built shared money-management and
  multi-account banking tools aimed at couples and households, backed by the
  fintech venture firm Anthemis. As of 2026 Ivella's products have been sunset
  and the team has joined EarnIn to continue building. This API Evangelist
  profile was surfaced as an Anthemis portfolio-company lead; the enrichment
  pipeline found no public developer portal, API documentation, OpenAPI, or
  other machine-readable API surface, and the company is no longer operating as
  an independent product.
